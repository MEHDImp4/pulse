name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pulse-bot:ci .

      - name: Unraid AppData first-run permission smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-appdata"
          chmod 755 "$RUNNER_TEMP/pulse-appdata"
          docker run --rm \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -v "$RUNNER_TEMP/pulse-appdata:/data" \
            pulse-bot:ci node -e "const fs=require('node:fs'); if(process.getuid() !== 1000) process.exit(2); fs.writeFileSync('/data/unraid-smoke.json','ok')"
          test "$(cat "$RUNNER_TEMP/pulse-appdata/unraid-smoke.json")" = "ok"

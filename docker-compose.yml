# No compilation or repository checkout is required for a normal install.
# The GHCR image becomes available after the publish workflow runs on master.
name: pulse

services:
  bot:
    image: ghcr.io/mehdimp4/pulse:${PULSE_IMAGE_TAG:-latest}
    container_name: pulse
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
    volumes:
      - pulse-data:/data

volumes:
  pulse-data:
